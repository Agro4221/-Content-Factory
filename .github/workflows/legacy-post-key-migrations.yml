name: Legacy post key migrations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/migrate-skipped-posts-independently]

permissions:
  contents: read

jobs:
  legacy-post-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run legacy post migration regression tests
        run: python -m pytest -q tests/test_legacy_post_key_migrations.py
