name: Media-only post publishing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/publish-media-without-caption]

permissions:
  contents: read

jobs:
  media-only-post-publishing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run media-only post regression tests
        run: python -m pytest -q tests/test_media_only_posts.py
