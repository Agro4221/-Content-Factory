name: Proxy setting normalization

on:
  pull_request:
    branches: [fix/validate-proxy-type-setting]
  push:
    branches: [fix/proxy-toggle-normalization-after-proxy-type]

permissions:
  contents: read

jobs:
  proxy-toggle-normalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run proxy type and toggle regression tests
        run: python -m pytest -q tests/test_proxy_type_setting.py tests/test_proxy_toggle_normalization.py
