name: Validate and publish Windows release

on:
  push:
    branches:
      - fix/local-bugfix-integration-2026-10-17
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag format
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Release tags must look like v1.2.3 or v1.2.3.4"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check admin panel JavaScript syntax
        run: python tools/check_frontend.py

      - name: Test proxy-check UI failures
        run: node tests/test_proxy_connection_rejection.cjs

      - name: Test topic settings UI
        run: node tests/test_topic_channels_ui.cjs

      - name: Run complete regression suite
        run: python -m pytest -q tests

      - name: Build Windows executable
        run: python -m PyInstaller Parser.spec --clean --noconfirm

      - name: Smoke-test built Windows executable
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "parser-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "parser-smoke.stderr.log"
          $oldApiHost = $env:API_HOST
          $oldApiPort = $env:API_PORT
          $oldBrowser = $env:BROWSER_OPEN_ON_START
          $oldAdminUser = $env:ADMIN_USERNAME
          $oldAdminPassword = $env:ADMIN_PASSWORD
          $env:API_HOST = "127.0.0.1"
          $env:API_PORT = "18765"
          $env:BROWSER_OPEN_ON_START = "0"
          $env:ADMIN_USERNAME = ""
          $env:ADMIN_PASSWORD = ""
          $process = $null
          try {
            $process = Start-Process -FilePath "dist/Parser.exe" -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          } finally {
            $env:API_HOST = $oldApiHost
            $env:API_PORT = $oldApiPort
            $env:BROWSER_OPEN_ON_START = $oldBrowser
            $env:ADMIN_USERNAME = $oldAdminUser
            $env:ADMIN_PASSWORD = $oldAdminPassword
          }
          try {
            $status = $null
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($process.HasExited) {
                throw "Parser.exe exited early with code $($process.ExitCode)"
              }
              try {
                $status = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/bot/status" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if ($null -eq $status) {
              throw "Parser.exe did not expose its API within 60 seconds"
            }
            if (-not $status.available -or $status.status -ne "stopped") {
              throw "Unexpected initial bot status: $($status | ConvertTo-Json -Compress)"
            }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:18765/" -TimeoutSec 5 -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "<html") {
              throw "Admin panel page did not return the expected HTML"
            }
            $favicon = Invoke-WebRequest -Uri "http://127.0.0.1:18765/favicon.png" -TimeoutSec 5 -UseBasicParsing
            if ($favicon.StatusCode -ne 200) {
              throw "Bundled favicon is not served"
            }
            Write-Host "Parser.exe smoke test passed: API, admin HTML, and favicon are reachable."
          } catch {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
          }

      - name: Verify executable and generate checksum
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Parser.exe")) {
            throw "PyInstaller finished without producing dist/Parser.exe"
          }
          $hash = (Get-FileHash "dist/Parser.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Parser.exe" | Set-Content -Encoding ascii "dist/Parser.exe.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Content-Factory-Windows-${{ github.run_number }}
          path: |
            dist/Parser.exe
            dist/Parser.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/Parser.exe" "dist/Parser.exe.sha256" --title "Content Factory $env:GITHUB_REF_NAME" --generate-notes --verify-tag
