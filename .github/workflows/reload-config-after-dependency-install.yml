name: Reload config after dependency installation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/reload-after-dependency-install]

permissions:
  contents: read

jobs:
  reload-config-after-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run dependency installation regression tests
        run: python -m pytest -q tests/test_dependency_install_restart.py
