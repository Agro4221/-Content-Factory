name: Local pipeline with bot token validation

on:
  pull_request:
    branches: [fix/legacy-db-timestamps-after-local-pipeline]
  push:
    branches: [fix/validate-bot-token-after-local-pipeline]

permissions:
  contents: read

jobs:
  local-pipeline-bot-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run all focused local regression tests
        run: >-
          python -m pytest -q
          tests/test_bot_token_format.py
          tests/test_telegram_backlog_cursor.py
          tests/test_legacy_db_timestamp_migration.py
          tests/test_send_retry_policy.py
          tests/test_database_save_failure.py
          tests/test_ai_failure_policy.py
          tests/test_malformed_ai_response.py
          tests/test_media_only_posts.py
          tests/test_document_media_routing.py
          tests/test_long_media_caption.py
          tests/test_telegram_text_truncation.py
          tests/test_media_download_cleanup.py
          tests/test_media_download_retry.py
