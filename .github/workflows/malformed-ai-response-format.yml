name: Malformed AI response format

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/reject-malformed-ai-response-format]

permissions:
  contents: read

jobs:
  malformed-ai-response:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run malformed AI response regression tests
        run: python -m pytest -q tests/test_malformed_ai_response.py
