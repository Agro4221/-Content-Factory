name: Reject incomplete enabled proxy settings

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/reject-enabled-proxy-without-host]

permissions:
  contents: read

jobs:
  reject-incomplete-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run proxy configuration regression tests
        run: python -m pytest -q tests/test_proxy_requires_complete_config.py
