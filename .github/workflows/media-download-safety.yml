name: Failed media download handling

on:
  pull_request:
    branches: [fix/cleanup-partial-media-downloads]
  push:
    branches: [fix/retry-media-download-failures-after-cleanup]

permissions:
  contents: read

jobs:
  media-download-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run media download safety regression tests
        run: python -m pytest -q tests/test_media_download_cleanup.py tests/test_media_download_retry.py
