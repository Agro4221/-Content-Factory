name: HTTP proxy credential URL encoding

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/http-proxy-credentials-encoding]

permissions:
  contents: read

jobs:
  http-proxy-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run proxy credential regression test
        run: python -m pytest -q tests/test_http_proxy_url.py
