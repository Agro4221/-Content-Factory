name: One-time published release notes cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release-descriptions:
    if: contains(github.event.head_commit.message, '[release-notes-cleanup-20261023]')
    runs-on: windows-latest
    steps:
      - name: Update existing release descriptions
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releaseSpecs = @(
            @{
              id = 420401293
              tag = "v1.29.0.3"
              name = "Content Factory v1.29.0.3"
              body = @'
# Content Factory v1.29.0.3

Самостоятельная сборка для Windows 10/11. Python не требуется.

## Исправления и изменения

- В ручном режиме сохраняет пост как черновик с исходным текстом, если обработка через ИИ завершилась ошибкой.
- Проверяет связь рерайта с исходным материалом: пустой или явно несвязанный результат пропускается (WARN-408, WARN-410).
- Конвертирует MOV, MKV, WebM и анимированные GIF в MP4 через FFmpeg, если он установлен. Без FFmpeg сохраняется прежний режим обработки, в журнале появляется WARN-409.
- Отправляет длинный текст целиком, не разделяя его между подписью к медиа и отдельным сообщением.
- Показывает отменённые и ошибочные публикации в счётчиках и фильтрах панели.

## Запуск

1. Скачайте Parser.exe и Parser.exe.sha256.
2. Для конвертации видео установите FFmpeg и добавьте ffmpeg.exe в PATH.
3. Запустите Parser.exe. При первом входе подтвердите авторизацию Telegram в консоли.

Контрольная сумма SHA-256 находится в файле Parser.exe.sha256.

Важно: эта сборка соответствует тегу v1.29.0.3. Изменения исходного кода, добавленные в main после этого тега, в EXE не входят.
'@
            },
            @{
              id = 420249051
              tag = "v1.29.0.2"
              name = "Content Factory v1.29.0.2 (устаревшая сборка)"
              body = @'
# Content Factory v1.29.0.2

**Статус: устаревшая сборка.** Заменена стабильным релизом [v1.29.0.3](https://github.com/Agro4221/-Content-Factory/releases/tag/v1.29.0.3).

В этой версии исправлен UnboundLocalError в основном цикле и автоматическое скрытие окна консоли после авторизации Telegram.

Файлы сохранены для истории и воспроизведения этой версии. Для обычного использования скачивайте v1.29.0.3.
'@
            },
            @{
              id = 419793200
              tag = "v1.29.0.1"
              name = "Content Factory v1.29.0.1 (устаревшая сборка)"
              body = @'
# Content Factory v1.29.0.1

**Статус: устаревшая сборка.** После неё выпущены v1.29.0.2 и стабильная v1.29.0.3.

Эта версия сохранена для истории. Её исполняемый файл и контрольная сумма оставлены доступными, но для обычного использования рекомендуется [v1.29.0.3](https://github.com/Agro4221/-Content-Factory/releases/tag/v1.29.0.3).
'@
            },
            @{
              id = 419737267
              tag = "v1.29.0.0"
              name = "Content Factory v1.29.0.0 (тестовая сборка, устарела)"
              body = @'
# Content Factory v1.29.0.0

**Статус: тестовая, устаревшая сборка.** Эта версия была опубликована для первичной проверки Windows EXE и заменена последующими выпусками.

Файлы сохранены для истории. Для обычного использования скачивайте стабильный релиз [v1.29.0.3](https://github.com/Agro4221/-Content-Factory/releases/tag/v1.29.0.3).
'@
            }
          )

          foreach ($spec in $releaseSpecs) {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($spec.id)"
            $current = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
            if ($current.tag_name -ne $spec.tag) {
              throw "Release ID $($spec.id) points to tag '$($current.tag_name)', expected '$($spec.tag)'. No update applied to this release."
            }

            $payload = @{
              name = $spec.name
              body = $spec.body
            } | ConvertTo-Json -Depth 5

            Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -ContentType "application/json" -Body $payload | Out-Null
            Write-Host "Updated release $($spec.tag)"
          }