name: Local pipeline proxy configuration validation

on:
  pull_request:
    branches: [fix/ai-mode-validation-after-local-pipeline]
  push:
    branches: [fix/require-valid-proxy-config-after-ai-mode]

permissions:
  contents: read

jobs:
  local-pipeline-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run all local regression tests
        run: python -m pytest -q tests
