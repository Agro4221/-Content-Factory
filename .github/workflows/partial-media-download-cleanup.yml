name: Partial media download cleanup

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/cleanup-partial-media-downloads]

permissions:
  contents: read

jobs:
  media-download-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run media cleanup regression tests
        run: python -m pytest -q tests/test_media_download_cleanup.py
