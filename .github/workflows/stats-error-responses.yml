name: Posts stats error responses

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/stats-errors-http-status]

permissions:
  contents: read

jobs:
  stats-error-responses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run posts stats error-response tests
        run: python -m pytest -q tests/test_stats_error_response.py
