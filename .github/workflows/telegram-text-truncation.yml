name: Telegram text truncation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/preserve-unbroken-long-text]

permissions:
  contents: read

jobs:
  telegram-text-truncation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Telegram text truncation tests
        run: python -m pytest -q tests/test_telegram_text_truncation.py
