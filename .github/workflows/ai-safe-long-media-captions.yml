name: AI-safe long media captions

on:
  pull_request:
    branches: [fix/route-documents-after-media-only]
  push:
    branches: [fix/preserve-long-media-caption-after-document-routing]

permissions:
  contents: read

jobs:
  long-media-captions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run combined publishing regression tests
        run: python -m pytest -q tests/test_ai_failure_policy.py tests/test_malformed_ai_response.py tests/test_media_only_posts.py tests/test_document_media_routing.py tests/test_long_media_caption.py
