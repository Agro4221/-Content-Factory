name: Local pipeline with proxy type validation

on:
  pull_request:
    branches: [fix/http-proxy-credentials-after-local-pipeline]
  push:
    branches: [fix/validate-proxy-type-after-local-pipeline]

permissions:
  contents: read

jobs:
  local-pipeline-proxy-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run local regression suite
        run: >-
          python -m pytest -q
          tests/test_dependency_install_restart.py
          tests/test_legacy_post_key_migrations.py
          tests/test_sqlite_datetime_modifiers.py
          tests/test_logs_limit_bounds.py
          tests/test_invalid_json_api.py
          tests/test_stats_error_response.py
          tests/test_active_sources_stats.py
          tests/test_stats_topic_channels_shape.py
          tests/test_ascii_integer_settings.py
          tests/test_http_proxy_url.py
          tests/test_proxy_type_setting.py
          tests/test_bot_token_format.py
          tests/test_telegram_backlog_cursor.py
          tests/test_legacy_db_timestamp_migration.py
          tests/test_send_retry_policy.py
          tests/test_database_save_failure.py
          tests/test_ai_failure_policy.py
          tests/test_malformed_ai_response.py
          tests/test_media_only_posts.py
          tests/test_document_media_routing.py
          tests/test_long_media_caption.py
          tests/test_telegram_text_truncation.py
          tests/test_media_download_cleanup.py
          tests/test_media_download_retry.py
