name: Topic channels stats JSON shape

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/stats-topic-channels-json-shape]

permissions:
  contents: read

jobs:
  topic-channel-json-shape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run topic-channel stats regression tests
        run: python -m pytest -q tests/test_stats_topic_channels_shape.py
