name: Preserve long media captions

on:
  pull_request:
    branches: [fix/document-media-type-routing]
  push:
    branches: [fix/preserve-long-media-captions-after-document-routing]

permissions:
  contents: read

jobs:
  long-media-captions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run long media caption regression tests
        run: python -m pytest -q tests/test_long_media_caption.py
