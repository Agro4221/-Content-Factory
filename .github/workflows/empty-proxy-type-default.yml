name: Consistent empty proxy type default

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/consistent-empty-proxy-type-default]

permissions:
  contents: read

jobs:
  consistent-proxy-type-default:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run proxy fallback regression test
        run: python -m pytest -q tests/test_empty_proxy_type_default.py
