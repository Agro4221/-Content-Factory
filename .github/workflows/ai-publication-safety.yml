name: AI publication safety

on:
  pull_request:
    branches: [fix/ai-failure-safe-publication]
  push:
    branches: [fix/validate-ai-format-after-failure-policy]

permissions:
  contents: read

jobs:
  ai-publication-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run AI safety regression tests
        run: python -m pytest -q tests/test_ai_failure_policy.py tests/test_malformed_ai_response.py
