name: Telegram send retry policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/retry-transient-telegram-send]

permissions:
  contents: read

jobs:
  send-retry-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Telegram send retry tests
        run: python -m pytest -q tests/test_send_retry_policy.py
