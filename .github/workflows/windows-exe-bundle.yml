name: Windows EXE bundle resources

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/local-bugfix-integration-2026-10-17]

permissions:
  contents: read

jobs:
  bundle-resources:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check bundled resource manifest
        run: python -m pytest -q tests/test_packaging_assets.py
      - name: Build Windows executable
        run: python -m PyInstaller Parser.spec --clean --noconfirm
      - name: Smoke-test built Windows executable
        shell: pwsh
        run: pwsh -NoProfile -File tools/smoke_test_windows.ps1

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Parser.exe")) {
            throw "PyInstaller finished without producing dist/Parser.exe"
          }
