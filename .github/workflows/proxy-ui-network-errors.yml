name: Proxy UI network error handling

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/proxy-test-network-errors]

permissions:
  contents: read

jobs:
  proxy-ui-network-errors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test proxy connection error handling
        run: node tests/test_proxy_connection_rejection.cjs
