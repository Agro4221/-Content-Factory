name: Proxy type setting validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/validate-proxy-type-setting]

permissions:
  contents: read

jobs:
  proxy-type-setting-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run proxy type regression tests
        run: python -m pytest -q tests/test_proxy_type_setting.py
