name: AI-safe media-only publishing

on:
  pull_request:
    branches: [fix/validate-ai-format-after-failure-policy]
  push:
    branches: [fix/publish-media-only-after-ai-safety]

permissions:
  contents: read

jobs:
  ai-safe-media-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run combined AI and media-only regression tests
        run: python -m pytest -q tests/test_ai_failure_policy.py tests/test_malformed_ai_response.py tests/test_media_only_posts.py
