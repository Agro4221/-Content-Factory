[tool.ruff]
# Настройки статического анализа проекта Content Factory.
# Проверка запускается командой: python -m ruff check .
target-version = "py311"
line-length = 128
extend-exclude = [
    "build",
    "dist",
    "release",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "W",     # warnings
    "I",     # порядок импортов
    "B",     # баги (bugbear)
    "C4",    # упрощение генераторов
    "SIM",   # упрощение кода
    "RET",   # возвращаемые значения
    "PIE",   # мелкие ошибки стиля
    "UP",    # современный синтаксис Python
    "ASYNC", # асинхронный код
    "PERF",  # производительность
    "TRY",   # обработка ошибок
    "FURB",  # скоростные замены
    "ISC",   # неявная склейка строк
]
ignore = [
    # Длина строк контролируется по месту: в SQL и логах строки длиннее 128.
    "E501",
    # Осознанные «широкие» исключения: у каждого есть запись в журнал и
    # печать в консоль — падать из-за чужой ошибки боту нельзя.
    "BLE001",
    # Вложенные with читаются понятнее, чем один с двумя контекстами.
    "SIM117",
    # Изменяемые атрибуты классов в тестах — норма для фикстур.
    "RUF012",
    # Нет смысла требовать docstring у каждой функции.
    "D",
    # У pytest-фикстур нет типа Self.
    "PYI034",
    # Слишком много аргументов и ветвей: модель настроек и обходные пути
    # в main.py длинные by design.
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR0911",
    # Модуль импортируется ради проверки доступности.
    "PLC0415",
    # Сообщения об ошибках намеренно длинные и на русском: их читает
    # пользователь в журнале и в панели, тесты проверяют их текст.
    "TRY003",
    # Исключения с сообщением внутри класса — слишком строго для проекта.
    "TRY301",
    # Списки собираются обычным циклом: так виден каждый случай и легко
    # добавить запись в журнал. Сжатие в comprehension ничего не даёт.
    "PERF401",
    # Проверки файловой системы (os.path.isfile, getsize) внутри async-кода:
    # они выполняются за микросекунды на локальном диске. Обёртка в поток
    # дороже самой проверки.
    "ASYNC240",
    # Чтение файла панели в обработчике — тоже локальный диск.
    "ASYNC230",
    # Ожидание с asyncio.sleep в цикле ожидания флага: флаг общий с потоком
    # панели, asyncio.Event здесь не подходит.
    "ASYNC110",
    # Параметр timeout у async-функций — часть публичного API модуля
    # проверки прокси, а не ошибка.
    "ASYNC109",
    # try/except/else вместо try/except с возвратом: текущий вид читается
    # понятнее в коде с несколькими ветками.
    "TRY300",
]


[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert в тестах — норма
    "PLR2004", # магические числа в тестах — норма
    "SLF001",  # доступ к внутренним переменным в тестах — осознанно
]
"tools/*" = [
    "S603",    # subprocess вызывается с фиксированными аргументами
    "S607",    # запуск python/node из репозитория
    "S101",    # assert в проверочных скриптах
    "T201",    # print в инструментах — это их вывод
]
"main.py" = [
    "T201",    # печать в консоль — основной способ вывода журнала
    # Импорты идут после check_and_install_dependencies(): библиотеки
    # должны быть установлены до их импорта, иначе процесс падает.
    "E402",
]
"env_loader.py" = [
    # console_setup импортируется первым: он настраивает вывод в UTF-8,
    # а остальные импорты уже могут печатать кириллицу.
    "E402",
]
"tests/check_secret_migration.py" = [
    # Скрипт подменяет sys.argv до импорта модулей приложения.
    "E402",
]

[tool.ruff.lint.isort]
known-first-party = ["main", "Site", "database", "config", "state", "paths"]

[tool.pytest.ini_options]
markers = [
    "real_security: тест проверяет саму защиту API — служебные послабления для тестов не применяются",
]
